<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新标签页</title>
  <script src="../shared/appearance.js"></script>
  <script src="focus-boot.js"></script>
  <style>html { background: var(--bg, #f5f6f8); } html[data-hop] body { visibility: hidden; }</style>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
<main id="spotlight" class="spotlight">
  <div class="search-card">
    <div class="search-row">
      <svg class="ui-icon search-icon" aria-hidden="true"><use href="../../assets/icons.svg#search"/></svg>
      <span id="scope-chip" class="scope-chip" hidden></span>
      <input id="query" type="text" autofocus autocomplete="off" spellcheck="false"
        placeholder="搜索或输入网址，输入 / 使用快捷词"
        role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" aria-label="搜索或输入网址">
    </div>
    <ul id="results" class="results" role="listbox" aria-label="搜索结果" hidden></ul>
  </div>
  <p class="hints" aria-hidden="true">
    <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
    <span><kbd>↵</kbd> 打开</span>
    <span><kbd id="mod-key">⌘</kbd><kbd>↵</kbd> 后台新标签打开</span>
    <span><kbd>/</kbd> 快捷词</span>
    <span><kbd>Esc</kbd> 清除</span>
  </p>
</main>

<button id="open-settings" class="corner-button" type="button" title="新标签页设置" aria-label="新标签页设置">
  <svg class="ui-icon" aria-hidden="true"><use href="../../assets/icons.svg#settings"/></svg>
</button>

<dialog id="settings" class="settings-dialog" aria-labelledby="settings-title">
  <form method="dialog" class="settings-inner" id="settings-form">
    <header class="settings-head">
      <h2 id="settings-title">快捷词</h2>
      <button class="icon-button" value="close" aria-label="关闭"><svg class="ui-icon" aria-hidden="true"><use href="../../assets/icons.svg#close"/></svg></button>
    </header>
    <p class="settings-hint">输入 <kbd>/</kbd> 加快捷词再按空格（或 Tab），之后的关键词只在对应网站的常用网址、历史记录和书签中搜索。</p>
    <ul id="shortcut-list" class="shortcut-list"></ul>
    <fieldset id="shortcut-editor" class="shortcut-editor">
      <legend id="editor-title">新增快捷词</legend>
      <label>快捷词<span class="prefix-input"><span>/</span><input id="shortcut-key" maxlength="16" placeholder="git" autocomplete="off"></span></label>
      <label>名称<input id="shortcut-name" maxlength="40" placeholder="GitHub" autocomplete="off"></label>
      <label class="wide">网站域名<input id="shortcut-domains" placeholder="github.com, gist.github.com" autocomplete="off"><small>多个域名用逗号分隔，包含子域名</small></label>
      <label class="wide">站内搜索地址（可选）<input id="shortcut-search" placeholder="https://github.com/search?q=%s" autocomplete="off"><small>用 %s 表示关键词；没有匹配结果时回车会用它搜索</small></label>
      <p id="shortcut-error" class="form-error" role="alert" hidden></p>
      <div class="editor-actions">
        <button type="button" id="cancel-edit" class="soft-button" hidden>取消编辑</button>
        <button type="button" id="save-shortcut" class="primary-button">添加</button>
      </div>
    </fieldset>
    <footer class="settings-foot">
      <button type="button" id="reset-shortcuts" class="text-button">恢复默认快捷词</button>
      <button type="button" id="clear-frequent" class="text-button danger">清除常用网址记录</button>
    </footer>
  </form>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="newtab.js"></script>
</body>
</html>
